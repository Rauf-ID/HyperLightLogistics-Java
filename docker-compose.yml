services:
  postgres:
    image: postgres:18
    container_name: postgres-java
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-java-data:/var/lib/postgresql
    networks:
      - db-net
volumes:
  postgres-java-data:

networks:
  db-net:
    driver: bridge