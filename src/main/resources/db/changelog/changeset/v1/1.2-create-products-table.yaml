databaseChangeLog:
  - changeSet:
      id: 1.2
      author: Rauf Agaguliev
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        preConditions:
          - not:
              sequenceExists:
                sequenceName: "products_sequence"
          - not:
              tableExists:
                tableName: "products"
      changes:
        - createSequence:
            sequenceName: "products_sequence"
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: "products"
            columns:
              - column:
                  name: "id"
                  type: "BIGINT"
                  constraints:
                    primaryKey: true
                    nullable: false
                  autoIncrement: false
                  defaultValueComputed: "nextval('products_sequence')"
              - column:
                  name: "name"
                  type: "VARCHAR(255)"
                  constraints:
                    nullable: false
              - column:
                  name: "price"
                  type: "DOUBLE PRECISION"
                  constraints:
                    nullable: false
              - column:
                  name: "description"
                  type: "TEXT"
              - column:
                  name: "category"
                  type: "VARCHAR(255)"
              - column:
                  name: "weight"
                  type: "DOUBLE PRECISION"
              - column:
                  name: "length"
                  type: "DOUBLE PRECISION"
              - column:
                  name: "width"
                  type: "DOUBLE PRECISION"
              - column:
                  name: "height"
                  type: "DOUBLE PRECISION"