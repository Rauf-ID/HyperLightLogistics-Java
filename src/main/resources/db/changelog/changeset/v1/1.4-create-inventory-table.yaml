databaseChangeLog:
  - changeSet:
      id: 1.4
      author: Rauf Agaguliev
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        preConditions:
          - not:
              sequenceExists:
                sequenceName: "inventory_sequence"
          - not:
              tableExists:
                tableName: "inventory"
      changes:
        - createSequence:
            sequenceName: "inventory_sequence"
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: "inventory"
            columns:
              - column:
                  name: "id"
                  type: "BIGINT"
                  constraints:
                    primaryKey: true
                    nullable: false
                  autoIncrement: false
                  defaultValueComputed: "nextval('inventory_sequence')"
              - column:
                  name: "warehouse_id"
                  type: "BIGINT"
                  constraints:
                    nullable: false
              - column:
                  name: "product_id"
                  type: "BIGINT"
                  constraints:
                    nullable: false
              - column:
                  name: "quantity"
                  type: "INTEGER"
        - addForeignKeyConstraint:
            baseTableName: "inventory"
            baseColumnNames: "warehouse_id"
            referencedTableName: "warehouses"
            referencedColumnNames: "id"
            constraintName: "fk_inventory_warehouse_id"
        - addForeignKeyConstraint:
            baseTableName: "inventory"
            baseColumnNames: "product_id"
            referencedTableName: "products"
            referencedColumnNames: "id"
            constraintName: "fk_inventory_product_id"